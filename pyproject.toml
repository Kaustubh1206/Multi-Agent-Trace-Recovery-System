[project]
name = "capstone-project-matrace"
version = "0.1.0"
description = "Phase 1: policy-guarded retail multi-agent system on pinned tau2 Retail"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "langsmith>=0.14.12,<0.15",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "tau2",
]

[tool.uv.sources]
tau2 = { git = "https://github.com/sierra-research/tau2-bench.git", rev = "fc0055dc4e0a316c3f83133267fbd6faaa770992" }

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_mas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
