name: Retail offline tests

on:
  push:
    branches: [phase-1-retail-mas, custom-retail-mas]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run python scripts/fetch_retail_data.py
      - run: uv run ruff check src tests scripts main.py
      - run: uv run pytest tests -q
